name: MacExtendServer
options:
  bundleIdPrefix: com.macextend
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0

targets:
  MacExtendServer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: MacExtend Server
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: "MacExtend necesita acceso a la red local para transmitir video a los monitores de Windows conectados."
        # Anunciarse por Bonjour (mismo tipo de servicio que va a usar el
        # descubrimiento real en la Fase 5) es lo que dispara de forma confiable el
        # prompt de permiso de Red Local en macOS reciente; sin esto, un listener a
        # secas a veces ni siquiera pide el permiso y las conexiones entrantes de
        # otros dispositivos se descartan en silencio.
        NSBonjourServices:
          - _macextend._tcp
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macextend.server
        PRODUCT_NAME: MacExtendServer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/GhostDisplay/CGVirtualDisplay-Bridging-Header.h
        # Firma ad-hoc (sin Team ID): significa que cada rebuild puede invalidar
        # permisos TCC ya otorgados (Screen Recording, Red Local) y macOS los vuelve
        # a pedir. Firmar con un Team ID real evitaría esto, pero la cuenta Personal
        # Team gratuita del desarrollador quedó con un certificado de desarrollo
        # atascado (creado en otra Mac o sesión, sin la clave privada disponible acá)
        # y las cuentas gratuitas no tienen acceso al portal web para revocarlo. Se
        # retoma cuando haga falta (probablemente al pasar a una cuenta paga para
        # notarización/distribución en la Fase 10).
        CODE_SIGN_STYLE: Automatic
